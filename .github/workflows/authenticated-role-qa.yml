name: Authenticated role QA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: authenticated-role-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  role-rls:
    name: Auth and RLS isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
      QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
      QA_CEO_EMAIL: ${{ secrets.QA_CEO_EMAIL }}
      QA_CEO_PASSWORD: ${{ secrets.QA_CEO_PASSWORD }}
      QA_DIRECTOR_EMAIL: ${{ secrets.QA_DIRECTOR_EMAIL }}
      QA_DIRECTOR_PASSWORD: ${{ secrets.QA_DIRECTOR_PASSWORD }}
      QA_SUBDIRECTOR_EMAIL: ${{ secrets.QA_SUBDIRECTOR_EMAIL }}
      QA_SUBDIRECTOR_PASSWORD: ${{ secrets.QA_SUBDIRECTOR_PASSWORD }}
      QA_LO_BELTRAN_EMAIL: ${{ secrets.QA_LO_BELTRAN_EMAIL }}
      QA_LO_BELTRAN_PASSWORD: ${{ secrets.QA_LO_BELTRAN_PASSWORD }}
      QA_NUEVA_COSTANERA_EMAIL: ${{ secrets.QA_NUEVA_COSTANERA_EMAIL }}
      QA_NUEVA_COSTANERA_PASSWORD: ${{ secrets.QA_NUEVA_COSTANERA_PASSWORD }}
      QA_SANTA_MARIA_EMAIL: ${{ secrets.QA_SANTA_MARIA_EMAIL }}
      QA_SANTA_MARIA_PASSWORD: ${{ secrets.QA_SANTA_MARIA_PASSWORD }}
      QA_OUTPUT_DIR: artifacts/authenticated-role-qa

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate complete QA configuration
        shell: bash
        run: |
          required=(
            NEXT_PUBLIC_SUPABASE_URL SUPABASE_ANON_KEY
            QA_CEO_EMAIL QA_DIRECTOR_EMAIL QA_SUBDIRECTOR_EMAIL
            QA_LO_BELTRAN_EMAIL QA_NUEVA_COSTANERA_EMAIL QA_SANTA_MARIA_EMAIL
          )
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ -z "$QA_PASSWORD" ]; then
            password_vars=(
              QA_CEO_PASSWORD QA_DIRECTOR_PASSWORD QA_SUBDIRECTOR_PASSWORD
              QA_LO_BELTRAN_PASSWORD QA_NUEVA_COSTANERA_PASSWORD QA_SANTA_MARIA_PASSWORD
            )
            for name in "${password_vars[@]}"; do
              if [ -z "${!name}" ]; then
                missing+=("$name")
              fi
            done
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Authenticated role QA configuration is incomplete:\n'
            printf ' - %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Run authenticated role and RLS QA
        run: pnpm qa:roles

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-role-qa-${{ github.run_id }}
          path: artifacts/authenticated-role-qa/manifest.json
          if-no-files-found: error
          retention-days: 30
