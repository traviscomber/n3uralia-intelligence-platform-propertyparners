name: Authenticated role QA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: authenticated-role-qa-${{ github.sha }}
  cancel-in-progress: false

jobs:
  role-rls:
    name: Auth and RLS isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QA_OUTPUT_DIR: artifacts/authenticated-role-qa
      QA_PROVISIONER_URL: https://orfncinmhymhhoxbxgjb.supabase.co/functions/v1/qalito-release-qa

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Provision ephemeral QA identities
        run: node scripts/manage-ephemeral-release-qa.mjs provision

      - name: Run authenticated role and RLS QA
        run: pnpm qa:roles

      - name: Cleanup ephemeral QA identities
        if: always()
        run: node scripts/manage-ephemeral-release-qa.mjs cleanup

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-role-qa-${{ github.run_id }}
          path: artifacts/authenticated-role-qa
          if-no-files-found: error
          retention-days: 30
