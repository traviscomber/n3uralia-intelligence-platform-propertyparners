name: N3uralia IP Boundaries

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  protect-proprietary-intelligence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify proprietary code boundaries
        run: pnpm security:ip-boundaries

      - name: Verify credential boundaries
        run: pnpm security:credential-boundaries

      - name: Verify API, log and browser exposure boundaries
        run: pnpm security:exposure-boundaries

      - name: Verify tenant isolation and client-data reuse boundaries
        run: pnpm security:tenant-isolation

      - name: Verify GitHub delivery classification
        run: pnpm security:delivery-classification

      - name: Verify GitHub delivery surface
        run: pnpm security:delivery-surface

      - name: Report GitHub delivery readiness
        run: pnpm security:delivery-readiness

      - name: Verify contract closeout manifest
        run: pnpm contract:closeout:verify

      - name: Report contract closeout status
        run: pnpm contract:closeout:report

      - name: Verify runtime configuration
        run: pnpm security:runtime-readiness

      - name: Verify runtime cutover policy
        run: pnpm security:runtime-cutover

      - name: Build without browser source maps
        run: pnpm build
