name: Supabase clean reconstruction

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/supabase-clean-reconstruction.yml"
      - "supabase/migrations/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/supabase-clean-reconstruction.yml"
      - "supabase/migrations/**"

permissions:
  contents: read

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
      SUPABASE_USE_SLIM_IMAGES: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Verify CLI
        run: supabase --version

      - name: Initialize local Supabase config
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi
          test -f supabase/config.toml

      - name: Build clean reconstruction migration set
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          source_dir="supabase/migrations"
          normalized_dir=".clean-reconstruction-migrations"
          baseline_file="20260712_production_database_init.sql"

          test -f "$source_dir/$baseline_file"

          rm -rf "$normalized_dir"
          mkdir -p "$normalized_dir"

          declare -A used_versions=()
          include=0

          # The repository contains pre-baseline experimental/legacy migrations
          # that were superseded by the complete production initialization.
          # Clean reconstruction starts at that explicit baseline and then
          # replays every later repository migration in source order.
          while IFS= read -r file; do
            base="$(basename "$file")"

            if [ "$base" = "$baseline_file" ]; then
              include=1
            fi

            if [ "$include" -ne 1 ]; then
              echo "skip superseded pre-baseline migration: $base"
              continue
            fi

            if [[ ! "$base" =~ ^([0-9]{8,14})_(.+)\.sql$ ]]; then
              echo "Unsupported migration filename: $base" >&2
              exit 1
            fi

            original_prefix="${BASH_REMATCH[1]}"
            name="${BASH_REMATCH[2]}"
            candidate="$original_prefix"

            while [ "${#candidate}" -lt 14 ]; do
              candidate="${candidate}0"
            done

            while [[ -n "${used_versions[$candidate]:-}" ]]; do
              candidate_num=$((10#$candidate + 1))
              printf -v candidate '%014d' "$candidate_num"
            done

            used_versions[$candidate]=1
            normalized="${candidate}_${name}.sql"

            if [ "$normalized" != "$base" ]; then
              echo "normalize migration: $base -> $normalized"
            fi

            cp "$file" "$normalized_dir/$normalized"
          done < <(find "$source_dir" -maxdepth 1 -type f -name '*.sql' | sort)

          test "$include" -eq 1
          test -n "$(find "$normalized_dir" -maxdepth 1 -type f -name '*.sql' -print -quit)"

          rm -f "$source_dir"/*.sql
          cp "$normalized_dir"/*.sql "$source_dir"/

          duplicates="$(find "$source_dir" -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | cut -d_ -f1 | sort | uniq -d)"
          if [ -n "$duplicates" ]; then
            echo "Duplicate normalized migration versions remain:" >&2
            echo "$duplicates" >&2
            exit 1
          fi

      - name: Start isolated local Supabase
        run: supabase start

      - name: Replay all migrations from zero
        run: supabase db reset

      - name: Verify critical reconstructed objects
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            required_relation text;
          begin
            foreach required_relation in array array[
              'public.profiles',
              'public.properties',
              'public.market_listings',
              'public.market_cbrs_reference_transactions',
              'public.market_neighborhoods',
              'public.valuation_cases',
              'public.valuation_comparables',
              'public.valuation_decision_log',
              'public.management_entities',
              'public.management_metric_definitions',
              'public.management_report_schedules',
              'public.management_report_distributions'
            ]
            loop
              if to_regclass(required_relation) is null then
                raise exception 'missing reconstructed relation: %', required_relation;
              end if;
            end loop;
          end
          $$;

          select
            count(*) filter (where schemaname = 'public' and tablename like 'valuation_%') as valuation_rls_tables,
            count(*) filter (where schemaname = 'public' and tablename like 'market_%') as market_rls_tables,
            count(*) filter (where schemaname = 'public' and tablename like 'management_%') as management_rls_tables
          from pg_tables
          where rowsecurity = true;
          SQL

      - name: Verify local migration history
        run: supabase migration list --local

      - name: Stop isolated stack
        if: always()
        run: supabase stop --no-backup
