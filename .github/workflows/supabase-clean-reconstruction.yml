name: Supabase migration history guard

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "config/production-schema-fingerprint.json"
      - ".github/workflows/supabase-clean-reconstruction.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "config/production-schema-fingerprint.json"
      - ".github/workflows/supabase-clean-reconstruction.yml"

permissions:
  contents: read

jobs:
  migration-history:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASELINE_LAST_VERSION: "20260918154759"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify production schema fingerprint
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs')
          const p = 'config/production-schema-fingerprint.json'
          const x = JSON.parse(fs.readFileSync(p, 'utf8'))
          if (x.projectRef !== 'orfncinmhymhhoxbxgjb') throw new Error('Unexpected Supabase project ref')
          if (x.migrations.lastVersion !== process.env.BASELINE_LAST_VERSION) throw new Error('Baseline migration version drift')
          if (x.migrations.count !== 327) throw new Error('Baseline migration count drift')
          const schemas = new Map(x.schemas.map(s => [s.schema, s]))
          if (!schemas.has('public') || !schemas.has('private')) throw new Error('Missing schema fingerprint')
          if (!x.captureMethod || x.captureMethod !== 'catalog-hash') throw new Error('Unknown fingerprint capture method')
          console.log('Production schema fingerprint contract verified.')
          NODE

      - name: Guard immutable migration history
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$PR_BASE_SHA" ]; then
            range="$PR_BASE_SHA...HEAD"
          elif [ -n "$PUSH_BEFORE_SHA" ] && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            range="$PUSH_BEFORE_SHA..HEAD"
          else
            range="HEAD^..HEAD"
          fi

          mapfile -t changes < <(git diff --name-status "$range" -- supabase/migrations || true)

          for change in "${changes[@]}"; do
            [ -z "$change" ] && continue

            status="$(printf '%s\n' "$change" | awk '{print $1}')"
            path="$(printf '%s\n' "$change" | awk '{print $NF}')"
            base="$(basename "$path")"

            case "$status" in
              A)
                if [[ ! "$base" =~ ^([0-9]{14})_([a-z0-9_]+)\.sql$ ]]; then
                  echo "New migrations require a unique 14-digit timestamp and snake_case name: $base" >&2
                  exit 1
                fi

                version="${BASH_REMATCH[1]}"
                if [ "$version" -le "$BASELINE_LAST_VERSION" ]; then
                  echo "New migration version must be newer than production baseline $BASELINE_LAST_VERSION: $base" >&2
                  exit 1
                fi

                count="$(find supabase/migrations -maxdepth 1 -type f -name "${version}_*.sql" | wc -l | tr -d ' ')"
                if [ "$count" -ne 1 ]; then
                  echo "Duplicate migration version $version detected." >&2
                  exit 1
                fi
                ;;
              M|D|R*)
                echo "Applied/legacy migrations are immutable after the 2026-09-20 baseline: $change" >&2
                exit 1
                ;;
              *)
                echo "Unsupported migration change status: $change" >&2
                exit 1
                ;;
            esac
          done

          echo "Migration history guard passed: no historical mutation or invalid new migration detected."

      - name: Explain restore boundary
        run: |
          echo "This workflow prevents new migration-history drift."
          echo "It does not claim backup restore or clean-room reconstruction."
          echo "Those require an isolated Supabase branch/project and are tracked separately."
