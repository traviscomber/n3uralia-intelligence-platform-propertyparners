name: Vitacura PRC public map payload probe

on:
  pull_request:
    paths:
      - '.github/workflows/prc-geopdf-probe.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Intercept public My Maps feature payloads
        run: |
          node <<'JS'
          const puppeteer = require('puppeteer-core')
          const fs = require('fs')
          const candidates = ['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser']
          const executablePath = candidates.find(p => fs.existsSync(p))
          if (!executablePath) throw new Error('No Chromium executable on runner')

          const maps = [
            {name:'edification', mid:'1c01sgZ9vUTm7sJVd8oz9cfv9hH3-9kYT', tokens:['E-Ab1','E-Am3sz','E-Ae3sz']},
            {name:'land_use', mid:'1HvsC09ycddCXYMDVJMasi5c_HQliaBKB', tokens:['U-PVOsz','U-POCsz','U-PCsz']},
          ]

          ;(async () => {
            const browser = await puppeteer.launch({headless:true, executablePath, args:['--no-sandbox','--disable-setuid-sandbox','--disable-dev-shm-usage']})
            try {
              for (const map of maps) {
                const page = await browser.newPage()
                const matches = []
                page.on('response', async response => {
                  try {
                    const url = response.url()
                    const headers = response.headers()
                    const ct = headers['content-type'] || ''
                    if (!/(json|javascript|text|protobuf|octet-stream)/i.test(ct) && !/(maps|mapdata|mymaps|rpc|preview)/i.test(url)) return
                    const len = Number(headers['content-length'] || 0)
                    if (len > 12_000_000) return
                    const buf = await response.buffer()
                    if (buf.length > 12_000_000) return
                    const body = buf.toString('utf8')
                    const found = map.tokens.filter(t => body.includes(t))
                    if (!found.length) return
                    const first = Math.min(...found.map(t => body.indexOf(t)).filter(i => i >= 0))
                    matches.push({url,status:response.status(),contentType:ct,bytes:buf.length,tokens:found,snippet:body.slice(Math.max(0,first-220), first+520).replace(/\s+/g,' ')})
                  } catch {}
                })
                await page.goto(`https://www.google.com/maps/d/embed?mid=${map.mid}`, {waitUntil:'networkidle2', timeout:60000})
                await new Promise(r => setTimeout(r,7000))
                console.log(`=== ${map.name} ===`)
                console.log(JSON.stringify(matches.slice(0,20), null, 2))
                if (!matches.length) throw new Error(`No feature payload found for ${map.name}`)
                await page.close()
              }
            } finally { await browser.close() }
          })().catch(err => { console.error(err); process.exit(1) })
          JS
