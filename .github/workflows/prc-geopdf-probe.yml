name: Vitacura PRC My Maps pageData probe

on:
  pull_request:
    paths:
      - '.github/workflows/prc-geopdf-probe.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inspect My Maps pageData serialization
        run: |
          python - <<'PY'
          import urllib.request, re
          for name,mid in (
            ('edification','1c01sgZ9vUTm7sJVd8oz9cfv9hH3-9kYT'),
            ('land_use','1HvsC09ycddCXYMDVJMasi5c_HQliaBKB'),
          ):
            req=urllib.request.Request(f'https://www.google.com/maps/d/embed?mid={mid}',headers={'User-Agent':'Mozilla/5.0'})
            text=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','replace')
            p=text.find('_pageData')
            print(f'=== {name} bytes={len(text)} pageData_at={p} ===')
            print('PAGEDATA_CONTEXT',text[max(0,p-500):p+1800].replace('\n',' ')[:2300])
            scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',text,re.I)
            big=max(scripts,key=len)
            print('BIG_SCRIPT_HEAD',big[:1600].replace('\n',' '))
            print('BIG_SCRIPT_TAIL',big[-1200:].replace('\n',' '))
            print('big_len',len(big),'backslash_u',big.count('\\u'),'backslash_x',big.count('\\x'),'base64ish_runs',len(re.findall(r'[A-Za-z0-9+/]{200,}={0,2}',big)))
          PY
