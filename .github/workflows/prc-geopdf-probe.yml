name: Vitacura PRC My Maps geometry path probe

on:
  pull_request:
    paths:
      - '.github/workflows/prc-geopdf-probe.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Pin My Maps geometry path
        run: |
          python - <<'PY'
          import urllib.request, re, json
          cases=[
            ('edification','1c01sgZ9vUTm7sJVd8oz9cfv9hH3-9kYT','311AD7C3B3000002'),
            ('land_use','1HvsC09ycddCXYMDVJMasi5c_HQliaBKB','31236BDA50000001'),
          ]
          def load(mid):
            req=urllib.request.Request(f'https://www.google.com/maps/d/embed?mid={mid}',headers={'User-Agent':'Mozilla/5.0'})
            text=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','replace')
            m=re.search(r'var\s+_pageData\s*=\s*("(?:\\.|[^"\\])*")\s*;',text)
            data=json.loads(json.loads(m.group(1)))
            found=[]
            def walk(v):
              if isinstance(v,list):
                if v and v[0]=='mf.map': found.append(v)
                for x in v: walk(x)
            walk(data); return found[0]
          def find_feature(v,fid):
            if isinstance(v,list):
              if len(v)>=8 and v[0]==fid and isinstance(v[3],list) and isinstance(v[5],list): return v
              for x in v:
                r=find_feature(x,fid)
                if r is not None: return r
          def dims(v,depth=0):
            if not isinstance(v,list): return type(v).__name__
            return [len(v)] + ([dims(v[0],depth+1)] if v and depth<8 else [])
          def pairs(v,out):
            if isinstance(v,list):
              if len(v)==2 and all(isinstance(x,(int,float)) for x in v): out.append(v)
              else:
                for x in v: pairs(x,out)
          for name,mid,fid in cases:
            f=find_feature(load(mid),fid)
            print('===',name,'===')
            print('feature_len',len(f),'geometry_dims',dims(f[3]))
            print('feature_scalar_fields',[(i,x) for i,x in enumerate(f) if not isinstance(x,list)])
            print('attrs',f[5])
            out=[]; pairs(f[3],out)
            print('geometry_pairs',len(out),'first',out[:8],'last',out[-8:])
            # Print nested path candidates whose direct children are coordinate pairs.
            def visit(v,path=()):
              if isinstance(v,list):
                if len(v)>=4 and all(isinstance(p,list) and len(p)==2 and all(isinstance(x,(int,float)) for x in p) for p in v):
                  print('RING',path,'len',len(v),'first',v[:3],'last',v[-3:])
                else:
                  for i,x in enumerate(v): visit(x,path+(i,))
            visit(f[3])
          PY
