name: Vitacura PRC embedded map document probe

on:
  pull_request:
    paths:
      - '.github/workflows/prc-geopdf-probe.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inspect embedded My Maps document payload
        run: |
          python - <<'PY'
          import urllib.request, re, html as htmlmod
          maps=[
            ('edification','1c01sgZ9vUTm7sJVd8oz9cfv9hH3-9kYT',['E-Ab1','E-Am3sz','E-Ae3sz']),
            ('land_use','1HvsC09ycddCXYMDVJMasi5c_HQliaBKB',['U-PVOsz','U-POCsz','U-PCsz']),
          ]
          for name,mid,tokens in maps:
            req=urllib.request.Request(f'https://www.google.com/maps/d/embed?mid={mid}',headers={'User-Agent':'Mozilla/5.0'})
            raw=urllib.request.urlopen(req,timeout=30).read()
            text=raw.decode('utf-8','replace')
            decoded=htmlmod.unescape(text)
            print(f'=== {name} status bytes={len(raw)} ===')
            for token in tokens:
              forms={
                'literal':token,
                'json_unicode':token.replace('-','\\u002d'),
                'js_hex':token.replace('-','\\x2d'),
                'url':token.replace('-','%2D'),
              }
              hits={k: text.lower().count(v.lower()) for k,v in forms.items()}
              hits['html_decoded']=decoded.lower().count(token.lower())
              print(token,hits)
              positions=[]
              for hay in (text,decoded):
                p=hay.lower().find(token.lower())
                if p>=0: positions.append(hay[max(0,p-260):p+700].replace('\n',' ')[:960])
              for snippet in positions[:2]: print('SNIPPET',snippet)
            for marker in ('_pageData','mapData','feature','geometry','layer','E-Ab','U-PVO'):
              print('marker',marker,'count',text.lower().count(marker.lower()))
            scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',text,re.I)
            ranked=sorted(((len(s),i,('E-Ab' in s or 'U-PVO' in s)) for i,s in enumerate(scripts)),reverse=True)[:10]
            print('largest_scripts',ranked)
          PY
