name: Vitacura PRC public map network probe

on:
  pull_request:
    paths:
      - '.github/workflows/prc-geopdf-probe.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Inspect public My Maps network data endpoints
        run: |
          node <<'JS'
          const puppeteer = require('puppeteer-core')
          const fs = require('fs')
          const candidates = ['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser']
          const executablePath = candidates.find(p => fs.existsSync(p))
          if (!executablePath) throw new Error('No Chromium executable on runner')
          const maps = [
            {name:'edification', mid:'1c01sgZ9vUTm7sJVd8oz9cfv9hH3-9kYT'},
            {name:'land_use', mid:'1HvsC09ycddCXYMDVJMasi5c_HQliaBKB'},
          ]
          ;(async () => {
            const browser = await puppeteer.launch({headless:true, executablePath, args:['--no-sandbox','--disable-setuid-sandbox','--disable-dev-shm-usage']})
            try {
              for (const map of maps) {
                const page = await browser.newPage()
                const seen = []
                page.on('response', async response => {
                  try {
                    const url = response.url()
                    const headers = response.headers()
                    const ct = headers['content-type'] || ''
                    if (/image|font|css/i.test(ct)) return
                    if (!/(google|maps|gstatic)/i.test(url)) return
                    let bytes = Number(headers['content-length'] || 0)
                    if (!bytes && /(json|javascript|text|protobuf|octet-stream)/i.test(ct)) {
                      try { bytes = (await response.buffer()).length } catch {}
                    }
                    seen.push({status:response.status(),contentType:ct,bytes,url})
                  } catch {}
                })
                await page.goto(`https://www.google.com/maps/d/embed?mid=${map.mid}`, {waitUntil:'domcontentloaded', timeout:45000})
                await new Promise(r => setTimeout(r,12000))
                const uniq = [...new Map(seen.map(x => [x.url,x])).values()]
                  .sort((a,b) => b.bytes-a.bytes)
                  .slice(0,80)
                console.log(`=== ${map.name} responses ===`)
                console.log(JSON.stringify(uniq,null,2))
                const html = await page.content()
                console.log(`DOM bytes=${Buffer.byteLength(html)} title=${JSON.stringify(await page.title())}`)
                await page.close()
              }
            } finally { await browser.close() }
          })().catch(err => { console.error(err); process.exit(1) })
          JS
