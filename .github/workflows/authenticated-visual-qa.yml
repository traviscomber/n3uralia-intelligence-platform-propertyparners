name: Authenticated visual QA

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Production or preview URL to audit
        required: false
        default: https://n3uralia-intelligence-platform.vercel.app

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QA_BASE_URL: ${{ inputs.base_url }}
      QA_OUTPUT_DIR: artifacts/visual-qa
      QA_CEO_EMAIL: ${{ secrets.QA_CEO_EMAIL }}
      QA_CEO_PASSWORD: ${{ secrets.QA_CEO_PASSWORD }}
      QA_DIRECTOR_EMAIL: ${{ secrets.QA_DIRECTOR_EMAIL }}
      QA_DIRECTOR_PASSWORD: ${{ secrets.QA_DIRECTOR_PASSWORD }}
      QA_LO_BELTRAN_EMAIL: ${{ secrets.QA_LO_BELTRAN_EMAIL }}
      QA_LO_BELTRAN_PASSWORD: ${{ secrets.QA_LO_BELTRAN_PASSWORD }}
      QA_NUEVA_COSTANERA_EMAIL: ${{ secrets.QA_NUEVA_COSTANERA_EMAIL }}
      QA_NUEVA_COSTANERA_PASSWORD: ${{ secrets.QA_NUEVA_COSTANERA_PASSWORD }}
      QA_SANTA_MARIA_EMAIL: ${{ secrets.QA_SANTA_MARIA_EMAIL }}
      QA_SANTA_MARIA_PASSWORD: ${{ secrets.QA_SANTA_MARIA_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate required secrets
        id: preflight
        shell: bash
        run: |
          mkdir -p artifacts/visual-qa
          required=(
            QA_CEO_EMAIL QA_CEO_PASSWORD
            QA_DIRECTOR_EMAIL QA_DIRECTOR_PASSWORD
            QA_LO_BELTRAN_EMAIL QA_LO_BELTRAN_PASSWORD
            QA_NUEVA_COSTANERA_EMAIL QA_NUEVA_COSTANERA_PASSWORD
            QA_SANTA_MARIA_EMAIL QA_SANTA_MARIA_PASSWORD
          )
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            complete=true
          else
            complete=false
          fi
          printf '{\n  "generatedAt": "%s",\n  "baseUrl": "%s",\n  "complete": %s,\n  "missing": [' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$QA_BASE_URL" "$complete" > artifacts/visual-qa/preflight.json
          for i in "${!missing[@]}"; do
            [ "$i" -gt 0 ] && printf ', ' >> artifacts/visual-qa/preflight.json
            printf '"%s"' "${missing[$i]}" >> artifacts/visual-qa/preflight.json
          done
          printf ']\n}\n' >> artifacts/visual-qa/preflight.json
          echo "complete=$complete" >> "$GITHUB_OUTPUT"
          if [ "$complete" != true ]; then
            printf 'Missing GitHub Actions secrets:\n'
            printf ' - %s\n' "${missing[@]}"
          fi

      - name: Run authenticated visual QA
        if: steps.preflight.outputs.complete == 'true'
        run: pnpm qa:visual

      - name: Upload visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-visual-qa-${{ github.run_id }}
          path: artifacts/visual-qa
          if-no-files-found: error
          retention-days: 14

      - name: Fail when secrets are incomplete
        if: steps.preflight.outputs.complete != 'true'
        shell: bash
        run: |
          echo "Authenticated visual QA was not executed because required secrets are incomplete."
          exit 1
