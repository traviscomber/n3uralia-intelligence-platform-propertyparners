name: Authenticated visual QA

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Production or preview URL to audit
        required: false
        default: https://ppartnersgroup.app
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: authenticated-visual-qa-${{ github.sha }}
  cancel-in-progress: false

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QA_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.base_url || 'https://ppartnersgroup.app' }}
      QA_EXPECTED_SHA: ${{ github.sha }}
      QA_OUTPUT_DIR: artifacts/visual-qa
      QA_PROVISIONER_URL: https://orfncinmhymhhoxbxgjb.supabase.co/functions/v1/qalito-release-qa

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for the exact production release
        if: github.event_name == 'push'
        shell: bash
        run: |
          node <<'NODE'
          const baseUrl = process.env.QA_BASE_URL
          const expectedSha = process.env.QA_EXPECTED_SHA
          const maxAttempts = 60
          const delayMs = 10_000

          for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
            try {
              const response = await fetch(`${baseUrl}/api/release`, {
                headers: { 'cache-control': 'no-cache' },
              })
              if (response.ok) {
                const release = await response.json()
                console.log(`release check ${attempt}/${maxAttempts}: ${release.sha ?? 'unknown'} (${release.environment ?? 'unknown'})`)
                if (release.sha === expectedSha && release.environment === 'production') {
                  process.exit(0)
                }
              } else {
                console.log(`release check ${attempt}/${maxAttempts}: HTTP ${response.status}`)
              }
            } catch (error) {
              console.log(`release check ${attempt}/${maxAttempts}: ${error instanceof Error ? error.message : String(error)}`)
            }

            if (attempt < maxAttempts) await new Promise((resolve) => setTimeout(resolve, delayMs))
          }

          console.error(`Production did not expose expected commit ${expectedSha} at ${baseUrl} within the verification window.`)
          process.exit(1)
          NODE

      - name: Provision ephemeral QA identities
        run: node scripts/manage-ephemeral-release-qa.mjs provision

      - name: Run authenticated visual QA
        run: pnpm qa:visual

      - name: Cleanup ephemeral QA identities
        if: always()
        run: node scripts/manage-ephemeral-release-qa.mjs cleanup

      - name: Upload visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-visual-qa-${{ github.run_id }}
          path: artifacts/visual-qa
          if-no-files-found: error
          retention-days: 14
