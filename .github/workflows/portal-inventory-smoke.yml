name: Portal Inventory Policy CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/portal-inmobiliario-collector.ts'
      - 'lib/portal-discovery-evidence.ts'
      - 'lib/portal-inventory-scheduler.ts'
      - 'lib/portal-offer-day.ts'
      - 'lib/portal-offer-service.ts'
      - 'lib/market-pedro-history.ts'
      - 'lib/market-pedro-overview.ts'
      - 'app/dashboard/market/page.tsx'
      - 'app/dashboard/market/layout.tsx'
      - 'tests/market/market-pedro-home.test.ts'
      - 'app/dashboard/market/oferta/page.tsx'
      - 'tests/market/portal-offer-day.test.ts'
      - 'lib/brightdata-portal-collector.ts'
      - 'app/api/cron/market-delta/route.ts'
      - 'vercel.json'
      - 'tests/market/*.test.ts'
      - 'lib/portal-inventory-policy.ts'
      - 'app/api/cron/market-refresh/route.ts'
      - 'app/api/internal/portal-collector-smoke/route.ts'
      - 'tests/market/portal-inventory-policy.test.ts'
      - 'scripts/smoke-portal-inventory.ts'
      - '.github/workflows/portal-inventory-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-inventory-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inventory-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify inventory acceptance and duplicate controls (deterministic)
        run: >-
          node --import tsx --test
          tests/market/portal-inventory-policy.test.ts
          tests/market/portal-discovery-evidence.test.ts
          tests/market/portal-inventory-scheduler.test.ts
          tests/market/portal-offer-day.test.ts
          tests/market/market-pedro-home.test.ts

      - name: Explain separate live-source release gate
        if: github.event_name == 'pull_request'
        run: echo "::notice::Contract passed offline only. Live Portal connectivity and full inventory reconciliation must be verified separately before release."

      - name: Verify live full Portal inventory coverage (manual external gate)
        if: github.event_name == 'workflow_dispatch'
        run: node --import tsx scripts/smoke-portal-inventory.ts
