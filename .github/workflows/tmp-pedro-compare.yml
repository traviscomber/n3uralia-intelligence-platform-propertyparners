name: Pedro Scraper Comparison

on:
  push:
    branches: [test/pedro-scraper-real-case]
    paths:
      - 'scripts/tmp-pedro-compare.ts'
      - '.github/workflows/tmp-pedro-compare.yml'

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --import tsx scripts/tmp-pedro-compare.ts
