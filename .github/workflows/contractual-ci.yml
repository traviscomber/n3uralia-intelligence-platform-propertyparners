name: Contractual modules CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main, fix/portal-full-snapshot-reconciliation-v2, feat/market-today-presentation]
  push:
    branches:
      - main
      - agent/contractual-scope-sanitization

permissions:
  contents: read

concurrency:
  group: contractual-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, contractual gates, models and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit legacy code
        run: pnpm audit:legacy

      - name: Upload legacy audit report
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: legacy-code-audit
          path: artifacts/legacy-code-audit.json
          if-no-files-found: error
          retention-days: 1

      - name: Verify SECURITY DEFINER contract
        run: pnpm security:secdef-contract

      - name: Lint
        run: pnpm lint

      - name: Verify executive dashboard comparisons
        run: node --import tsx --test tests/executive-dashboard-comparisons.test.ts

      - name: Verify contractual closeout model
        run: pnpm contract:closeout:verify

      - name: Verify contractual evidence
        run: pnpm contract:closeout:evidence:verify

      - name: Verify client dependencies
        run: pnpm contract:dependencies:verify

      - name: Verify client dependency requests
        run: pnpm contract:dependency-requests:verify

      - name: Verify closeout documents
        run: pnpm contract:documents:verify

      - name: Verify UAT case status
        run: pnpm contract:uat:verify

      - name: Verify training status
        run: pnpm contract:training:verify

      - name: Verify delivery package inventory
        run: pnpm contract:package:verify

      - name: Verify client acceptance status
        run: pnpm contract:acceptance:verify

      - name: Verify production readiness status
        run: pnpm contract:production:verify

      - name: Verify closeout snapshot
        run: pnpm contract:snapshot:verify

      - name: Verify market identity
        run: pnpm market:identity:verify

      - name: Verify contractual market imports
        run: pnpm market:contract:verify

      - name: Verify valuation model
        run: pnpm valuation:model:verify

      - name: Verify valuation workflow
        run: pnpm valuation:workflow:verify

      - name: Verify valuation draft canonical subject linkage
        run: node --import tsx --test tests/valuation/draft-canonical-subject.test.ts

      - name: Verify property condition assessment
        run: pnpm valuation:condition:verify

      - name: Verify public valuation estimator safeguards
        run: node --import tsx --test tests/valuation/public-estimator.test.ts

      - name: Verify canonical management scoring
        run: pnpm management:scoring:verify

      - name: Verify 2025 management source contracts
        run: pnpm exec tsx scripts/verify-management-source-contracts-2025.ts

      - name: Verify 2025 monthly management baseline
        run: pnpm exec tsx scripts/verify-management-baseline-2025-events.ts

      - name: Verify weekly report authorization scopes
        run: node --import tsx --test tests/management-report-scope.test.ts

      - name: Verify Property360 comparable gates
        run: node --import tsx --test tests/property360-comparables.test.ts

      - name: Verify Jan-Aug canonical management periods
        run: node --import tsx --test tests/management-canonical-periods.test.ts

      - name: Verify Office 360 canonical management contract
        run: node --import tsx --test tests/management-office360-canonical.test.ts

      - name: Verify canonical valuation source authority
        run: node --import tsx --test tests/valuation/canonical-source-authority.test.ts

      - name: Verify Portal snapshot publication policy
        run: node --import tsx --test tests/portal-snapshot-policy.test.ts

      - name: Verify management report scheduling
        run: pnpm management:reports:verify

      - name: Verify contractual report automation
        run: node --import tsx --test tests/management-contract-automation.test.ts

      - name: Verify approved management metric overlay
        run: pnpm management:persisted:verify

      - name: Verify management metric reconciliation
        run: pnpm management:reconciliation:verify

      - name: Verify management report delivery
        run: pnpm management:delivery:verify

      - name: Verify canonical company sales target
        run: pnpm exec tsx scripts/verify-canonical-company-sales-target.ts

      - name: Verify Property Partners Santiago timezone
        run: pnpm exec tsx scripts/verify-property-partners-timezone.ts

      - name: Verify Vitacura property-assignment scope
        run: pnpm exec tsx scripts/verify-property-assignment-vitacura-scope.ts

      - name: Verify scoped seller visibility RPC
        run: pnpm exec tsx scripts/verify-management-visible-sellers-rpc.ts

      - name: Verify operational CEO coherence
        run: pnpm exec tsx scripts/verify-operational-ceo-coherence.ts

      - name: Verify CEO report snapshot-aware dedupe
        run: pnpm exec tsx scripts/verify-ceo-report-snapshot-dedupe.ts

      - name: Verify Reportin canonical PDF and delivery contract
        run: pnpm reportin:verify

      - name: Verify Reportin CEO intelligence contract
        run: pnpm exec tsx --tsconfig scripts/tsconfig.reportin.json scripts/verify-reportin-ceo-intelligence.ts

      - name: Verify CEO house-only contractual scope
        run: pnpm exec tsx --tsconfig scripts/tsconfig.reportin.json scripts/verify-ceo-house-scope.ts

      - name: Verify dashboard access
        run: pnpm access:verify

      - name: Build application
        run: pnpm build
