name: Portal Daily Snapshot

on:
  schedule:
    - cron: '30 10 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/serverless-browser.ts'
      - 'lib/portal-inmobiliario-collector.ts'
      - 'scripts/run-portal-external-snapshot.ts'
      - 'app/api/internal/portal-github-ingest/route.ts'
      - '.github/workflows/portal-daily-snapshot.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: portal-daily-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    # Primary zero-credit runtime: an always-on N3uralia worker located on a
    # normal Chilean office/residential network where Portal works in Chrome.
    runs-on: [self-hosted, n3uralia, portal, chile]
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Chrome
        shell: bash
        run: |
          set -euo pipefail
          chrome="${PUPPETEER_EXECUTABLE_PATH:-}"
          if [ -z "$chrome" ]; then
            for candidate in               "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"               "/usr/bin/google-chrome"               "/usr/bin/google-chrome-stable"               "/usr/bin/chromium"               "/usr/bin/chromium-browser"
            do
              if [ -x "$candidate" ]; then
                chrome="$candidate"
                break
              fi
            done
          fi
          if [ -z "$chrome" ] || [ ! -x "$chrome" ]; then
            echo "Chrome is not available on the self-hosted runner." >&2
            exit 1
          fi
          echo "PUPPETEER_EXECUTABLE_PATH=$chrome" >> "$GITHUB_ENV"
          "$chrome" --version

      - name: Capture and publish Portal snapshot
        env:
          NODE_ENV: production
        run: node --import tsx scripts/run-portal-external-snapshot.ts
