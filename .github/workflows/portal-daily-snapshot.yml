name: Portal Daily Snapshot

on:
  # The direct Chrome/GitHub collector is a legacy manual diagnostic.
  # It is blocked by Portal anti-bot protection in GitHub runners.
  # Production updates use Bright Data /api/cron/market-delta and the
  # verified /api/cron/market-refresh instead.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: portal-daily-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: macos-14
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Chrome
        shell: bash
        run: |
          set -euo pipefail
          chrome="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          if [ ! -x "$chrome" ]; then
            chrome="$(command -v google-chrome || command -v chromium || true)"
          fi
          if [ -z "$chrome" ] || [ ! -x "$chrome" ]; then
            echo "Chrome is not available on this runner." >&2
            exit 1
          fi
          echo "PUPPETEER_EXECUTABLE_PATH=$chrome" >> "$GITHUB_ENV"
          "$chrome" --version

      - name: Capture and publish Portal snapshot
        env:
          NODE_ENV: production
        run: node --import tsx scripts/run-portal-external-snapshot.ts
