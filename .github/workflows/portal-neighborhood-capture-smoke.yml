name: Portal Neighborhood Capture Smoke

on:
  push:
    branches: [feat/portal-nearby-neighborhood-intelligence]
    paths:
      - 'lib/portal-inmobiliario-collector.ts'
      - 'scripts/smoke-portal-neighborhood-capture.ts'
      - '.github/workflows/portal-neighborhood-capture-smoke.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture unresolved Portal sample
        run: node --import tsx scripts/smoke-portal-neighborhood-capture.ts
