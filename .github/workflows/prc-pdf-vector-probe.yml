name: Vitacura PRC PDF vector probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/prc-pdf-vector-probe.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install PDF inspection tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Download current consolidated municipal plans
        run: |
          curl -L --fail --retry 3 -o edification.pdf 'https://vitacura.cl/descargas/plano_regulador/pdf/2021/01_prc-v__plano_de_edificacion_vigente_2021.pdf'
          curl -L --fail --retry 3 -o land-use.pdf 'https://vitacura.cl/descargas/plano_regulador/pdf/2021/02_prc-v__plano_de_usos_de_suelo_vigente_2021.pdf'
      - name: Inspect PDF structure
        run: |
          set -e
          for pdf in edification.pdf land-use.pdf; do
            base="${pdf%.pdf}"
            echo "=== $pdf ==="
            pdfinfo "$pdf" | grep -E 'Pages|Page size|File size|PDF version' || true
            echo '-- fonts --'
            pdffonts "$pdf" | tail -n +3 | wc -l
            echo '-- embedded images --'
            pdfimages -list "$pdf" | tail -n +3 | tee "$base-images.txt"
            echo '-- svg vector counts --'
            pdftocairo -svg "$pdf" "$base.svg"
            printf 'paths='; grep -o '<path' "$base.svg" | wc -l
            printf 'images='; grep -o '<image' "$base.svg" | wc -l
            printf 'svg_bytes='; wc -c < "$base.svg"
            echo '-- top fill colors --'
            grep -oE 'fill:rgb\([^)]*\)' "$base.svg" | sort | uniq -c | sort -nr | head -40 || true
            echo '-- coordinate and zone text boxes --'
            pdftotext -bbox-layout "$pdf" "$base.html" 2>/dev/null || true
            grep -E 'E-Ab|E-Am|E-Ae|E-Ee|U-P|U-Ee|>U-V<|350500|351000|352000|353000|354000|355000|356000|357000|358000|359000|630[0-9]{4}' "$base.html" | head -120 || true
          done
