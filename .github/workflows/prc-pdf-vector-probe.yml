name: Vitacura PRC PDF vector probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/prc-pdf-vector-probe.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install PDF inspection tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m pip install --quiet pymupdf
      - name: Download current consolidated municipal plans
        run: |
          curl -L --fail --retry 3 -o edification.pdf 'https://vitacura.cl/descargas/plano_regulador/pdf/2021/01_prc-v__plano_de_edificacion_vigente_2021.pdf'
          curl -L --fail --retry 3 -o land-use.pdf 'https://vitacura.cl/descargas/plano_regulador/pdf/2021/02_prc-v__plano_de_usos_de_suelo_vigente_2021.pdf'
      - name: Inspect PDF vector drawings and labels
        run: |
          python - <<'PY'
          import fitz, re, collections
          for filename in ('edification.pdf','land-use.pdf'):
              doc=fitz.open(filename); page=doc[0]
              drawings=page.get_drawings()
              filled=[d for d in drawings if d.get('fill') is not None]
              colors=collections.Counter(tuple(round(float(x),4) for x in d['fill']) for d in filled)
              print(f'=== {filename} ===')
              print('page', page.rect.width, page.rect.height, 'drawings', len(drawings), 'filled', len(filled))
              print('top_fill_colors')
              for color,count in colors.most_common(40): print(count,color)
              print('large_filled_samples')
              large=sorted(filled,key=lambda d:d['rect'].get_area(),reverse=True)[:40]
              for d in large:
                  print(round(d['rect'].get_area(),1), tuple(round(float(x),4) for x in d['fill']), tuple(round(v,2) for v in d['rect']))
              print('coordinate_and_zone_spans')
              data=page.get_text('dict')
              for block in data.get('blocks',[]):
                  for line in block.get('lines',[]):
                      for span in line.get('spans',[]):
                          text=span.get('text','').strip()
                          if re.search(r'(?:E-A[mbbe]|E-Ee|U-P|U-Ee|^U-V$|\b(?:34[89]|35[0-9])\d{3}\b|\b63\d{5}\b)',text):
                              print(repr(text), tuple(round(v,2) for v in span['bbox']))
          PY
