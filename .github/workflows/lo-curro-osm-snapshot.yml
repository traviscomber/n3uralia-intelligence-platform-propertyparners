name: Lo Curro OSM Snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/lo-curro-osm-snapshot.yml'
      - 'app/api/cron/road-hierarchy-refresh/route.ts'
      - 'supabase/migrations/20260825_valuation_road_hierarchy_evidence_v1.sql'
      - 'supabase/migrations/20260825_valuation_topography_road_backtest_lo_curro_v1.sql'

permissions:
  contents: read

env:
  BBOX: '-33.377,-70.568,-33.359,-70.540'

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch OSM road snapshot
        shell: bash
        run: |
          set -euo pipefail
          query='[out:json][timeout:60];way[highway~"^(motorway|trunk|primary|secondary|tertiary|unclassified|residential|living_street|service)$"]('${BBOX}');out tags center;'
          for endpoint in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter; do
            if curl --fail --show-error --silent --retry 3 --retry-all-errors --max-time 90 \
              -A 'PropertyPartners-Intelligence/1.0' \
              --data-urlencode "data=${query}" "$endpoint" -o lo-curro-osm.json; then
              test -s lo-curro-osm.json && break
            fi
          done
          test -s lo-curro-osm.json
          python - <<'PY'
          import json
          with open('lo-curro-osm.json', encoding='utf-8') as f:
              d=json.load(f)
          els=[e for e in d.get('elements',[]) if e.get('type')=='way' and e.get('center') and e.get('tags',{}).get('highway')]
          with open('lo-curro-roads.json','w',encoding='utf-8') as f:
              json.dump({'generated_from':'OpenStreetMap Overpass','elements':els},f,separators=(',',':'))
          print(f'roads={len(els)}')
          if len(els)<20:
              raise SystemExit('insufficient roads')
          PY
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: lo-curro-osm-roads
          path: lo-curro-roads.json
          retention-days: 3
