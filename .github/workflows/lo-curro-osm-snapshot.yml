name: Lo Curro OSM Snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/lo-curro-osm-snapshot.yml'
      - 'app/api/cron/road-hierarchy-refresh/route.ts'
      - 'supabase/migrations/20260825_valuation_road_hierarchy_evidence_v1.sql'
      - 'supabase/migrations/20260825_valuation_topography_road_backtest_lo_curro_v1.sql'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch OSM map extract
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --retry 4 --retry-all-errors --max-time 120 \
            -A 'PropertyPartners-Intelligence/1.0' \
            'https://api.openstreetmap.org/api/0.6/map?bbox=-70.568,-33.377,-70.540,-33.359' \
            -o lo-curro.osm
          test -s lo-curro.osm

      - name: Reduce to functional roads
        shell: bash
        run: |
          python - <<'PY'
          import json, xml.etree.ElementTree as ET
          allowed={'motorway','trunk','primary','secondary','tertiary','unclassified','residential','living_street','service'}
          root=ET.parse('lo-curro.osm').getroot()
          nodes={n.attrib['id']:(float(n.attrib['lat']),float(n.attrib['lon'])) for n in root.findall('node')}
          out=[]
          for w in root.findall('way'):
              tags={t.attrib['k']:t.attrib['v'] for t in w.findall('tag')}
              highway=tags.get('highway')
              if highway not in allowed:
                  continue
              pts=[nodes[nd.attrib['ref']] for nd in w.findall('nd') if nd.attrib['ref'] in nodes]
              if len(pts)<2:
                  continue
              lat=sum(p[0] for p in pts)/len(pts)
              lon=sum(p[1] for p in pts)/len(pts)
              out.append({'type':'way','id':int(w.attrib['id']),'center':{'lat':lat,'lon':lon},'geometry':[{'lat':a,'lon':b} for a,b in pts],'tags':tags})
          with open('lo-curro-roads.json','w',encoding='utf-8') as f:
              json.dump({'generated_from':'OpenStreetMap API 0.6 map','elements':out},f,separators=(',',':'))
          print(f'roads={len(out)}')
          if len(out)<20:
              raise SystemExit('insufficient roads')
          PY

      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: lo-curro-osm-roads
          path: lo-curro-roads.json
          retention-days: 3
