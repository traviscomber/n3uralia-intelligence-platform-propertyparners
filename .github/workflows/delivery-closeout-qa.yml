name: Delivery closeout QA

on:
  push:
    branches:
      - qa/delivery-uat-closeout-20260901

permissions:
  contents: write

concurrency:
  group: delivery-closeout-qa
  cancel-in-progress: false

jobs:
  closeout:
    name: Technical, security and authenticated UAT evidence
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QA_BASE_URL: https://ppartnersgroup.app
      QA_OUTPUT_DIR: artifacts/visual-qa
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
      QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
      QA_CEO_EMAIL: ${{ secrets.QA_CEO_EMAIL }}
      QA_CEO_PASSWORD: ${{ secrets.QA_CEO_PASSWORD }}
      QA_DIRECTOR_EMAIL: ${{ secrets.QA_DIRECTOR_EMAIL }}
      QA_DIRECTOR_PASSWORD: ${{ secrets.QA_DIRECTOR_PASSWORD }}
      QA_SUBDIRECTOR_EMAIL: ${{ secrets.QA_SUBDIRECTOR_EMAIL }}
      QA_SUBDIRECTOR_PASSWORD: ${{ secrets.QA_SUBDIRECTOR_PASSWORD }}
      QA_LO_BELTRAN_EMAIL: ${{ secrets.QA_LO_BELTRAN_EMAIL }}
      QA_LO_BELTRAN_PASSWORD: ${{ secrets.QA_LO_BELTRAN_PASSWORD }}
      QA_NUEVA_COSTANERA_EMAIL: ${{ secrets.QA_NUEVA_COSTANERA_EMAIL }}
      QA_NUEVA_COSTANERA_PASSWORD: ${{ secrets.QA_NUEVA_COSTANERA_PASSWORD }}
      QA_SANTA_MARIA_EMAIL: ${{ secrets.QA_SANTA_MARIA_EMAIL }}
      QA_SANTA_MARIA_PASSWORD: ${{ secrets.QA_SANTA_MARIA_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Synchronize lockfile
        shell: bash
        run: pnpm install --lockfile-only

      - name: Commit synchronized lockfile when needed
        id: lockfile
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "n3uralia-qa-bot"
          git config user.email "n3uralia-qa-bot@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: sync pnpm lockfile"
          git push origin HEAD:qa/delivery-uat-closeout-20260901
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Frozen lockfile install
        run: pnpm install --frozen-lockfile

      - name: Technical acceptance
        run: pnpm qa:technical

      - name: Security boundary gates
        shell: bash
        run: |
          pnpm security:ip-boundaries
          pnpm security:credential-boundaries
          pnpm security:exposure-boundaries
          pnpm security:tenant-isolation

      - name: Check authenticated UAT readiness
        id: auth-preflight
        shell: bash
        run: |
          mkdir -p artifacts
          required=(
            NEXT_PUBLIC_SUPABASE_URL SUPABASE_ANON_KEY
            QA_CEO_EMAIL QA_CEO_PASSWORD
            QA_DIRECTOR_EMAIL QA_DIRECTOR_PASSWORD
            QA_LO_BELTRAN_EMAIL QA_LO_BELTRAN_PASSWORD
            QA_NUEVA_COSTANERA_EMAIL QA_NUEVA_COSTANERA_PASSWORD
            QA_SANTA_MARIA_EMAIL QA_SANTA_MARIA_PASSWORD
          )
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            printf '%s\n' "Authenticated role/visual UAT is HOLD because designated QA credentials are not configured." > artifacts/authenticated-uat-status.txt
            printf 'Missing configuration keys (values are never printed):\n' >> artifacts/authenticated-uat-status.txt
            printf ' - %s\n' "${missing[@]}" >> artifacts/authenticated-uat-status.txt
            echo "Authenticated UAT: HOLD (credentials/participants not configured)."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            printf '%s\n' "Authenticated role/visual UAT is configured and will execute." > artifacts/authenticated-uat-status.txt
          fi

      - name: Authenticated role and RLS QA
        if: steps.auth-preflight.outputs.ready == 'true'
        env:
          QA_OUTPUT_DIR: artifacts/authenticated-role-qa
        run: pnpm qa:roles

      - name: Authenticated visual QA
        if: steps.auth-preflight.outputs.ready == 'true'
        env:
          QA_OUTPUT_DIR: artifacts/visual-qa
        run: pnpm qa:visual

      - name: Upload closeout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delivery-closeout-qa-${{ github.run_id }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 30
