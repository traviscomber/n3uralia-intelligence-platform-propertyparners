name: Temporary Coordinate Sample

on:
  push:
    branches: [feat/portal-nearby-neighborhood-intelligence]
    paths:
      - 'scripts/tmp-measure-unresolved-coordinates.ts'
      - '.github/workflows/tmp-coordinate-sample.yml'

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --import tsx scripts/tmp-measure-unresolved-coordinates.ts
